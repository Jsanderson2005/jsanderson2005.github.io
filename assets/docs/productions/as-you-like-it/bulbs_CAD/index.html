    }
    if(eq){showEquipmentTip(eq,e);renderer.domElement.style.cursor='pointer'}else{tip.style.display='none';renderer.domElement.style.cursor=''}
    render();return;
  }

  if(cableHit){
    if(hoveredEquipment){setEquipmentCableHighlights(hoveredEquipment,false);hoveredEquipment=null;clearEquipmentHighlight()}
    const hits=ray.intersectObjects(cableHits,false),nextNames=new Set();
    if(hits.length){
      const d0=hits[0].distance;
      // Treat near-identical ray hits as the same visible overlap stack.
      for(const h of hits){
        if(h.distance-d0>55)break;
        const n=findCableName(h.object);if(n)nextNames.add(n);
      }
    }
    for(const n of hoveredCableNames)if(!nextNames.has(n))setCableHighlight(n,false);
    for(const n of nextNames)if(!hoveredCableNames.has(n))setCableHighlight(n,true);
    hoveredCableNames=nextNames;
    hoveredCable=cableHit;
    const names=[...nextNames];
    if(chosenOverlapCable&&nextNames.has(chosenOverlapCable.objectName)){
      showCableDetails(chosenOverlapCable,e);
    }else{
      if(chosenOverlapCable)chosenOverlapCable=null;
      if(names.length>1){
        tip.innerHTML=`<div class="title">${names.length} overlapping cables</div><div>Click to choose a cable</div>`;
        tip.style.display='block';tip.style.left=Math.min(innerWidth-260,e.clientX+22)+'px';tip.style.top=Math.min(innerHeight-100,e.clientY+22)+'px';
      }else showCableTip(cableHit,e);
    }
    renderer.domElement.style.cursor='pointer';render();return;
  }

  if(hoveredCable||hoveredCableNames.size){for(const n of hoveredCableNames)setCableHighlight(n,false);hoveredCableNames.clear();hoveredCable=null}
  chosenOverlapCable=null;
  const eq=equipmentHit?.userData?.equipment||null;
  if(eq!==hoveredEquipment){
    if(hoveredEquipment)setEquipmentCableHighlights(hoveredEquipment,false);
    hoveredEquipment=eq;clearEquipmentHighlight();
    if(eq){showEquipmentHighlight(eq);setEquipmentCableHighlights(eq,true)}
  }
  if(eq){showEquipmentTip(eq,e);renderer.domElement.style.cursor='pointer'}
  else{tip.style.display='none';renderer.domElement.style.cursor=''}
  render();
}
let pendingPointerEvent=null,pointerTimer=0;
renderer.domElement.addEventListener('pointermove',e=>{pendingPointerEvent=e;if(pointerTimer)return;pointerTimer=setTimeout(()=>{pointerTimer=0;const ev=pendingPointerEvent;pendingPointerEvent=null;if(ev)processPointerMove(ev)},32)});
renderer.domElement.addEventListener('pointerleave',()=>{
  const n=hoveredCable?findCableName(hoveredCable):null;if(n)setCableHighlight(n,false);hoveredCable=null;
  if(hoveredEquipment)setEquipmentCableHighlights(hoveredEquipment,false);
  hoveredEquipment=null;clearEquipmentHighlight();tip.style.display='none';renderer.domElement.style.cursor='';render();
});
function focusPowerDistribution(){
  // Start over the power-distribution area using cable connection points,
  // so this remains correct if the Vectorworks export moves slightly.
  const raw=[];
  for(const c of cableData){
    for(const [pointKey,nameKey] of [['startPoint','startObjectName'],['endPoint','endObjectName']]){
      const name=String(c[nameKey]||'').toUpperCase();
      if(!/(DISTRO|SMARTPACK|6PACK)/.test(name))continue;
      const p=c[pointKey];
      if(validPoint(p))raw.push(new THREE.Vector3(...p));
    }
  }
  if(!raw.length){fit();return}
  const box=new THREE.Box3().setFromPoints(raw);
  const localCenter=box.getCenter(new THREE.Vector3());
  // Convert from raw Vectorworks XYZ through the root transform to Three.js world space.
  const c=localCenter.clone(); root.localToWorld(c);
  controls.target.copy(c);
  camera.position.copy(c).add(new THREE.Vector3(2.8,3.2,3.8));
  camera.near=.01; camera.far=2000; camera.updateProjectionMatrix(); controls.update();
}
function fit(){const b=new THREE.Box3().setFromObject(root);if(b.isEmpty())return;const s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),r=Math.max(s.x,s.y,s.z);controls.target.copy(c);camera.position.copy(c).add(new THREE.Vector3(r*.8,r*.55,r*.8));camera.near=Math.max(.01,r/10000);camera.far=Math.max(100,r*20);camera.updateProjectionMatrix();controls.update()}


let pointerDownAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{pointerDownAt={x:e.clientX,y:e.clientY}});

function hideCablePicker(){cablePicker.classList.remove('show');cablePicker.innerHTML=''}
function cableCandidatesAtPointer(){
 const hits=ray.intersectObjects(cableHits,false),names=[],seen=new Set();
 if(!hits.length)return names;
 const d0=hits[0].distance;
 for(const h of hits){
   if(h.distance-d0>55)break;
   const n=findCableName(h.object);
   if(n&&!seen.has(n)){seen.add(n);names.push(n)}
 }
 return names;
}
function showCablePicker(names,e){
 cablePicker.innerHTML='<div class="cable-picker__title">Select cable</div>';
 for(const name of names){
   const c=cableMeta.get(name);if(!c)continue;
   const b=document.createElement('button');
   const label=c.loadID||c.objectName;
   b.innerHTML=`${esc(label)}<span>${esc(c.startObjectName||'Unknown')} → ${esc(c.endObjectName||'Unknown')}</span>`;
   b.onclick=ev=>{ev.stopPropagation();chosenOverlapCable=c;hideCablePicker();applyPowerSelection('cable',c);showCableDetails(c,ev)};
   cablePicker.appendChild(b);
 }
 const x=Math.min(innerWidth-350,Math.max(8,e.clientX+12)),y=Math.min(innerHeight-300,Math.max(8,e.clientY+12));
 cablePicker.style.left=x+'px';cablePicker.style.top=y+'px';cablePicker.classList.add('show');
}
renderer.domElement.addEventListener('click',e=>{
 if(pointerDownAt&&Math.hypot(e.clientX-pointerDownAt.x,e.clientY-pointerDownAt.y)>5){pointerDownAt=null;return}
 pointerDownAt=null;
 mouse.x=e.clientX/renderer.domElement.clientWidth*2-1;mouse.y=-(e.clientY/renderer.domElement.clientHeight)*2+1;ray.setFromCamera(mouse,camera);
 const targets=pointerTargets(),eq=targets.equipment?.userData?.equipment;
 if(eq){hideCablePicker();applyPowerSelection(eq.equipmentType==='lightingDevice'?'fixture':'equipment',eq);return}
 const cableNames=targets.cable?cableCandidatesAtPointer():[];
 if(cableNames.length===1){hideCablePicker();const c=cableMeta.get(cableNames[0]);if(c)applyPowerSelection('cable',c);return}
 if(cableNames.length>1){showCablePicker(cableNames,e);return}
 hideCablePicker();clearPowerSelection();render()
});


addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  hideCablePicker();clearPowerSelection();
  const n=hoveredCable?findCableName(hoveredCable):null;
  if(n)setCableHighlight(n,false);
  hoveredCable=null;
  if(hoveredEquipment)setEquipmentCableHighlights(hoveredEquipment,false);
  hoveredEquipment=null;
  clearEquipmentHighlight();
  tip.style.display='none';
  renderer.domElement.style.cursor='';render();
});

introClose.addEventListener('click',()=>{introDismissed=true;intro.classList.add('closing');setTimeout(()=>intro.remove(),520)});

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render()});render();
</script></body></html>
